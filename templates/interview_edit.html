{% extends "base.html" %}


{% block title %}
    Edit Interview — JobPilot
{% endblock %}


{% block content %}

<!-- ========================================
     EDIT INTERVIEW
======================================== -->

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card p-4">


            <!-- ==================================
                 BACK TO INTERVIEWS
            ================================== -->

            <a
                href="{{ url_for('interviews') }}"
                class="text-decoration-none"
            >
                ← Interviews
            </a>


            <!-- ==================================
                 PAGE HEADER
            ================================== -->

            <h2 class="fw-bold mt-3">
                Edit interview
            </h2>


            <!-- ==================================
                 INTERVIEW FORM
            ================================== -->

            <form
                method="post"
                class="mt-3"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >


                <!-- Date -->

                <label class="form-label">
                    Date
                </label>

                <input
                    type="date"
                    name="interview_date"
                    value="{{ interview[2] }}"
                    class="form-control mb-3"
                    required
                >


                <!-- Time -->

                <label class="form-label">
                    Time
                </label>

                <input
                    type="time"
                    name="interview_time"
                    value="{{ interview[3] or '' }}"
                    class="form-control mb-3"
                >


                <!-- Round -->

                <label class="form-label">
                    Round
                </label>

                <input
                    name="round_name"
                    value="{{ interview[4] or '' }}"
                    class="form-control mb-3"
                >


                <!-- Mode -->

                <label class="form-label">
                    Mode
                </label>

                <select
                    name="mode"
                    class="form-select mb-3"
                >

                    {% for m in interview_modes %}

                        <option
                            {% if interview[5] == m %}
                                selected
                            {% endif %}
                        >
                            {{ m }}
                        </option>

                    {% endfor %}

                </select>


                <!-- Notes -->

                <label class="form-label">
                    Notes
                </label>

                <textarea
                    name="notes"
                    class="form-control mb-3"
                    rows="5"
                >{{ interview[6] or '' }}</textarea>


                <!-- Form Actions -->

                <button class="btn btn-primary">
                    Save changes
                </button>

                <a
                    href="{{ url_for('interviews') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>


{% endblock %}
