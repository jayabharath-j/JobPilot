{% extends "base.html" %}


{% block title %}
    {{ mode }} Application — JobPilot
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-xl-9">

        <div class="card p-4">

            <!-- ========================================
                 BACK TO APPLICATIONS
            ======================================== -->

            <a
                href="{{ url_for('applications') }}"
                class="text-decoration-none"
            >
                ← Applications
            </a>


            <!-- ========================================
                 PAGE HEADER
            ======================================== -->

            <h2 class="fw-bold mt-3">
                {{ mode }} application
            </h2>

            <p class="text-secondary">
                Capture enough context now so you can follow up later.
            </p>


            {% set a = application %}


            <!-- ========================================
                 APPLICATION FORM
            ======================================== -->

            <form method="post" class="mt-3">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token }}"
                >


                <div class="row g-3">


                    <!-- ==================================
                         COMPANY
                    ================================== -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Company *
                        </label>

                        <input
                            name="company"
                            class="form-control"
                            value="{{ a[2] if a else '' }}"
                            required
                        >

                    </div>


                    <!-- ==================================
                         ROLE
                    ================================== -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Role *
                        </label>

                        <input
                            name="role"
                            class="form-control"
                            value="{{ a[3] if a else '' }}"
                            required
                        >

                    </div>


                    <!-- ==================================
                         LOCATION
                    ================================== -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            name="location"
                            class="form-control"
                            value="{{ a[4] if a else '' }}"
                        >

                    </div>


                    <!-- ==================================
                         JOB TYPE
                    ================================== -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Job type
                        </label>

                        <select
                            name="job_type"
                            class="form-select"
                        >

                            {% for j in job_types %}

                                <option
                                    {% if a and a[5] == j %}
                                        selected
                                    {% endif %}
                                >
                                    {{ j }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- ==================================
                         SALARY
                    ================================== -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Salary
                        </label>

                        <input
                            name="salary"
                            class="form-control"
                            value="{{ a[6] if a else '' }}"
                            placeholder="e.g. ₹5 LPA"
                        >

                    </div>


                    <!-- ==================================
                         APPLICATION DATE
                    ================================== -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Application date *
                        </label>

                        <input
                            type="date"
                            name="application_date"
                            class="form-control"
                            value="{{ a[7] if a else today }}"
                            required
                        >

                    </div>


                    <!-- ==================================
                         JOB URL
                    ================================== -->

                    <div class="col-md-8">

                        <label class="form-label">
                            Job URL
                        </label>

                        <input
                            type="url"
                            name="job_url"
                            class="form-control"
                            value="{{ a[8] if a else '' }}"
                            placeholder="https://..."
                        >

                    </div>


                    <!-- ==================================
                         STATUS
                    ================================== -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                        >

                            {% for s in statuses %}

                                <option
                                    {% if a and a[9] == s %}
                                        selected

                                    {% elif not a and s == 'Applied' %}
                                        selected
                                    {% endif %}
                                >
                                    {{ s }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- ==================================
                         FOLLOW-UP DATE
                    ================================== -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Follow-up date
                        </label>

                        <input
                            type="date"
                            name="follow_up_date"
                            class="form-control"
                            value="{{ a[14] if a else '' }}"
                        >

                    </div>


                    <!-- ==================================
                         FOLLOW-UP STATUS
                    ================================== -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Follow-up status
                        </label>

                        <select
                            name="follow_up_status"
                            class="form-select"
                        >

                            {% for f in followup_statuses %}

                                <option
                                    {% if a and a[15] == f %}
                                        selected
                                    {% endif %}
                                >
                                    {{ f }}
                                </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- ==================================
                         RESUME VERSION
                    ================================== -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Resume version
                        </label>

                        <input
                            name="resume_version"
                            class="form-control"
                            value="{{ a[16] if a else '' }}"
                            placeholder="Backend Resume v2"
                        >

                    </div>


                    <!-- ==================================
                         RECRUITER NAME
                    ================================== -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Recruiter name
                        </label>

                        <input
                            name="recruiter_name"
                            class="form-control"
                            value="{{ a[17] if a else '' }}"
                        >

                    </div>


                    <!-- ==================================
                         RECRUITER EMAIL
                    ================================== -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Recruiter email
                        </label>

                        <input
                            type="email"
                            name="recruiter_email"
                            class="form-control"
                            value="{{ a[18] if a else '' }}"
                        >

                    </div>


                    <!-- ==================================
                         RECRUITER PHONE
                    ================================== -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Recruiter phone
                        </label>

                        <input
                            name="recruiter_phone"
                            class="form-control"
                            value="{{ a[19] if a else '' }}"
                        >

                    </div>


                    <!-- ==================================
                         FAVORITE
                    ================================== -->

                    <div class="col-12">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                name="is_favorite"
                                id="favorite"
                                {% if a and a[13] %}
                                    checked
                                {% endif %}
                            >

                            <label
                                class="form-check-label"
                                for="favorite"
                            >
                                ⭐ Mark as favourite
                            </label>

                        </div>

                    </div>


                    <!-- ==================================
                         NOTES
                    ================================== -->

                    <div class="col-12">

                        <label class="form-label">
                            Notes
                        </label>

                        <textarea
                            name="notes"
                            rows="6"
                            class="form-control"
                            placeholder="Requirements, recruiter notes, interview prep, next steps..."
                        >{{ a[10] if a else '' }}</textarea>

                    </div>

                </div>


                <!-- ========================================
                     FORM ACTIONS
                ======================================== -->

                <div class="mt-4">

                    <button class="btn btn-primary">
                        {{ mode }} Application
                    </button>

                    <a
                        href="{{ url_for('applications') }}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
